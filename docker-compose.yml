services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: familylink
      POSTGRES_USER: familylink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familylink"]
      interval: 5s
      timeout: 5s
      retries: 10

  cookie-refresher:
    build:
      context: .
      dockerfile: Dockerfile.refresher
    restart: unless-stopped
    environment:
      REFRESHER_API_KEY: ${REFRESHER_API_KEY:-}
      FIREFOX_PROFILE_DIR: /profile
    volumes:
      - firefox_profile:/profile:ro
    depends_on:
      - firefox

  firefox:
    # noVNC UI on 3000 — expose ONLY behind auth (Traefik basic-auth) or keep internal; NEVER expose publicly.
    image: lscr.io/linuxserver/firefox:latest
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - firefox_profile:/config

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://familylink:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db/familylink
      COOKIE_REFRESHER_URL: http://cookie-refresher:8080
      REFRESHER_API_KEY: ${REFRESHER_API_KEY:-}
      # Link shown on the 503 session-expired page so you can re-login. Set to the
      # AUTH-PROTECTED external URL of the firefox noVNC UI (see firefox service note).
      FIREFOX_NOVNC_URL: ${FIREFOX_NOVNC_URL:-}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-cha67f8p0xtt7y1mv464yu43.entryPoints=http
      - traefik.http.routers.http-0-cha67f8p0xtt7y1mv464yu43.middlewares=redirect-to-https
      - traefik.http.routers.http-0-cha67f8p0xtt7y1mv464yu43.rule=Host(`cha67f8p0xtt7y1mv464yu43.192.168.0.22.sslip.io`)
      - traefik.http.routers.http-0-cha67f8p0xtt7y1mv464yu43.service=http-0-cha67f8p0xtt7y1mv464yu43
      - traefik.http.routers.https-0-cha67f8p0xtt7y1mv464yu43.entryPoints=https
      - traefik.http.routers.https-0-cha67f8p0xtt7y1mv464yu43.middlewares=gzip
      - traefik.http.routers.https-0-cha67f8p0xtt7y1mv464yu43.rule=Host(`cha67f8p0xtt7y1mv464yu43.192.168.0.22.sslip.io`)
      - traefik.http.routers.https-0-cha67f8p0xtt7y1mv464yu43.tls=true
      - traefik.http.routers.https-0-cha67f8p0xtt7y1mv464yu43.service=http-0-cha67f8p0xtt7y1mv464yu43
      - traefik.http.services.http-0-cha67f8p0xtt7y1mv464yu43.loadbalancer.server.port=8000

volumes:
  pgdata:
  firefox_profile:
