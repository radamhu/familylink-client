services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: familylink
      POSTGRES_USER: familylink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familylink"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 192M
        reservations:
          memory: 96M

  cookie-refresher:
    build:
      context: .
      dockerfile: Dockerfile.refresher
    restart: unless-stopped
    environment:
      REFRESHER_API_KEY: ${REFRESHER_API_KEY:-}
      FIREFOX_PROFILE_DIR: /profile
    volumes:
      - firefox_profile:/profile:ro
    depends_on:
      - firefox
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 96M
        reservations:
          memory: 48M

  ekreta-scraper:
    build: ./ekreta-scraper
    restart: unless-stopped
    environment:
      FAMILYLINK_API_URL: http://web:8000
      EKRETA_INGEST_TOKEN: ${EKRETA_INGEST_TOKEN:-}
      CRON_SCHEDULE: ${EKRETA_CRON_SCHEDULE:-0 6 * * 1-5}
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Playwright + Chromium, not just a script — needs headroom during the cron run.
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 96M

  firefox:
    # noVNC UI on 3000, exposed via Traefik behind basic-auth (middleware ff-auth).
    # This UI grants FULL control of the logged-in parent Google account — the
    # basic-auth below is the only thing protecting it. Rotate the hash if leaked.
    image: lscr.io/linuxserver/firefox:latest
    restart: unless-stopped
    # shm_size counts against the memory limit below on cgroup v2 (tmpfs pages
    # are charged to the container) — keep it well under the limit or Firefox
    # gets OOM-killed by its own quota instead of the host's.
    shm_size: "512mb"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - firefox_profile:/config
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 1024M
        reservations:
          memory: 384M
    labels:
      - traefik.enable=true
      - traefik.http.routers.ff-http.entryPoints=http
      - traefik.http.routers.ff-http.rule=Host(`firefox-familylink.192.168.0.5.sslip.io`)
      - traefik.http.routers.ff-http.middlewares=redirect-to-https
      - traefik.http.routers.ff-https.entryPoints=https
      - traefik.http.routers.ff-https.rule=Host(`firefox-familylink.192.168.0.5.sslip.io`)
      - traefik.http.routers.ff-https.tls=true
      - traefik.http.routers.ff-https.middlewares=ff-auth,gzip
      - traefik.http.routers.ff-https.service=ff
      - traefik.http.services.ff.loadbalancer.server.port=3000
      # basic-auth: user "parent". NOTE: Coolify passes label values to Traefik
      # literally (no docker-compose $$-unescaping), so use a SINGLE $ apr1 hash
      # here — NOT $$. If you ever run plain `docker compose` instead, you must
      # double the $ back to $$. Regenerate: `htpasswd -nbB parent <pass>`.
      - traefik.http.middlewares.ff-auth.basicauth.users=parent:$apr1$9gDWCDaM$qwjbCD2rKeIJbqDed1gJP1

  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://familylink:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db/familylink
      COOKIE_REFRESHER_URL: http://cookie-refresher:8080
      REFRESHER_API_KEY: ${REFRESHER_API_KEY:-}
      # Link shown on the 503 session-expired page so you can re-login. Set to the
      # AUTH-PROTECTED external URL of the firefox noVNC UI (see firefox service note).
      FIREFOX_NOVNC_URL: ${FIREFOX_NOVNC_URL:-}
      EKRETA_INGEST_TOKEN: ${EKRETA_INGEST_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the slim runtime image; a raw TCP connect is enough
      # to confirm uvicorn is actually accepting connections (not just that
      # the container started — alembic migrations run before it binds).
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 320M
        reservations:
          memory: 160M
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-familylink-web.entryPoints=http
      - traefik.http.routers.http-0-familylink-web.middlewares=redirect-to-https
      - traefik.http.routers.http-0-familylink-web.rule=Host(`familylink.192.168.0.5.sslip.io`)
      - traefik.http.routers.http-0-familylink-web.service=http-0-familylink-web
      - traefik.http.routers.https-0-familylink-web.entryPoints=https
      - traefik.http.routers.https-0-familylink-web.middlewares=gzip
      - traefik.http.routers.https-0-familylink-web.rule=Host(`familylink.192.168.0.5.sslip.io`)
      - traefik.http.routers.https-0-familylink-web.tls=true
      - traefik.http.routers.https-0-familylink-web.service=http-0-familylink-web
      - traefik.http.services.http-0-familylink-web.loadbalancer.server.port=8000

volumes:
  pgdata:
  firefox_profile:
