<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Family Link{% endblock %} — Family Link</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>Family Link</strong></li></ul>
      <ul>
        <li><a href="/">Dashboard</a></li>
        <li><a href="/apps">Apps</a></li>
        <li><a href="/devices">Devices</a></li>
        <li><a href="/linux-machines">Linux Machines</a></li>
        <li><a href="/history">History</a></li>
        <li><a href="/auth/logout" class="secondary">Logout</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% if auth_failed %}
    <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;padding:0.5rem 1rem;margin-bottom:1rem;color:#991b1b">
      ⚠️ Google session expired — the cookie-refresher sidecar will retry automatically, or run
      <code>familylink export-cookies --coolify --restart</code>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
